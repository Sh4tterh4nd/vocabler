spring.application.name=vocabler
spring.datasource.url=${VOCABLER_DB_URL:jdbc:h2:file:./data/vocabler}
spring.datasource.username=${VOCABLER_DB_USER:sa}
spring.datasource.password=${VOCABLER_DB_PASSWORD:}
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${VOCABLER_SECURE_COOKIE:false}
server.error.include-message=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
