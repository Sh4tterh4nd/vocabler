services:
  app:
    image:  ghcr.io/sh4tterh4nd/vocabler:latest
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      traefik.http.routers.vocabler-secured.entrypoints: web-secured
      traefik.http.routers.vocabler-secured.middlewares: default-https@file
      traefik.http.routers.vocabler-secured.rule: Host(`vocab.kellermann.io`)
      traefik.http.routers.vocabler-secured.tls.certresolver: mychallenge
      traefik.http.services.vocabler-secured.loadbalancer.server.port: 8080

    networks:
      - vocabler
      - traefik
    environment:
      VOCABLER_DB_URL: jdbc:postgresql://vocabler-postgres:5432/vocabler
      VOCABLER_DB_USER: vocabler
      VOCABLER_DB_PASSWORD: vocabler
      VOCABLER_SECURE_COOKIE: false
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    networks:
      vocabler:
        aliases:
          - vocabler-postgres
    environment:
      POSTGRES_DB: vocabler
      POSTGRES_USER: vocabler
      POSTGRES_PASSWORD: vocabler
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
networks:
  vocabler:
    external: false
  traefik:
    external: true