name: Test and publish container

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: compose-ci-only-password
      VOCABLER_IMAGE: vocabler:ci
      VOCABLER_PORT: "18080"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vocabler_test
          POSTGRES_USER: vocabler
          POSTGRES_PASSWORD: jdbc-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocabler -d vocabler_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test on H2 and PostgreSQL
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/vocabler_test
          TEST_DB_USER: vocabler
          TEST_DB_PASSWORD: jdbc-ci-only-password
        run: sh gradlew --no-daemon clean build postgresTest
      - name: Build container
        run: sh gradlew --no-daemon jibDockerBuild --image=vocabler:ci
      - name: Validate Compose and smoke-test container with PostgreSQL
        run: |
          docker compose -f compose.ci.yaml -p vocabler-ci config --quiet
          docker compose -f compose.ci.yaml -p vocabler-ci up -d --wait --wait-timeout 120
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:18080/actuator/health/readiness
          curl --fail http://127.0.0.1:18080/ | grep -q '<title>Vocabler</title>'
      - name: Container diagnostics
        if: failure()
        run: docker compose -f compose.ci.yaml -p vocabler-ci logs --no-color
      - name: Remove temporary CI containers and test database
        if: always()
        run: docker compose -f compose.ci.yaml -p vocabler-ci down --volumes --remove-orphans
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=nightly
            type=edge,branch=${{ github.event.repository.default_branch }}
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Publish with Jib
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: |
          tags=$(jq -r '.tags | map(split(":")[-1]) | join(",")' <<< "$IMAGE_METADATA")
          sh gradlew --no-daemon jib --image="${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            "-Djib.to.tags=$tags" \
            "-Djib.from.platforms=linux/amd64,linux/arm64"
